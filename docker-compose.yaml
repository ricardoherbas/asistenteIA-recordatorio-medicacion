services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: asistente_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend

  db:
    image: postgres:16-alpine
    container_name: asistente_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: asistente_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

  ollama:
    image: ollama/ollama:latest
    container_name: ollama_server
    restart: unless-stopped
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama

  stt-whisper:
    image: rhasspy/wyoming-whisper
    container_name: stt-whisper
    restart: unless-stopped
    expose:
      - "10300"
    command:
      - "--model"
      - "small-int8"
      - "--language"
      - "es"
      - "--uri"
      - "tcp://0.0.0.0:10300"
      - "--download-dir"
      - "/data"
    volumes:
      - ./models/whisper-data:/data

  tts-piper:
    image: rhasspy/wyoming-piper
    container_name: tts-piper
    restart: unless-stopped
    expose:
      - "10200"
    command:
      - "--voice"
      - "es_ES-sharvard-medium"
      - "--speaker"
      - "F"
      - "--uri"
      - "tcp://0.0.0.0:10200"
      - "--data-dir"
      - "/data"
      - "--download-dir"
      - "/data"
    volumes:
      - ./voices:/data

  prolog:
    build:
      context: ./prolog
    container_name: prolog
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8080"

  backend:
    build:
      context: ./backend
    container_name: backend
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "4000"
    depends_on:
      - db
      - ollama
      - stt-whisper
      - tts-piper
      - prolog

  motor-recordatorios:
    build:
      context: ./motor-recordatorios
      dockerfile: Dockerfile
    container_name: memoric_motor
    restart: "no"
    env_file:
      - .env
    environment:
      DB_HOST: db
      FIREBASE_CREDENTIALS_PATH: /run/secrets/firebase-credentials.json
    volumes:
      - ./backend/config/firebase-credentials.json:/run/secrets/firebase-credentials.json:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
  ollama_data: